name: release

# Пуш тега вида v0.2 прогоняет тесты, собирает Type9.exe и публикует GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test Type9.sln -c Release -nologo

      - name: Publish Type9.exe
        shell: pwsh
        run: ./build/build.ps1

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/Type9.exe dist/SHA256SUMS.txt `
            --title "Type9 ${{ github.ref_name }}" --notes-file docs/RELEASE_NOTES.md

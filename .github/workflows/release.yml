name: release

# Пуш тега вида v0.1 собирает оба варианта exe, прогоняет тесты и публикует GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test Type9.sln -c Release -nologo

      - name: Publish single-file exe
        shell: pwsh
        run: ./build/build.ps1

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/Type9.exe dist/Type9-lite.exe `
            --title "Type9 ${{ github.ref_name }}" --notes-file docs/RELEASE_NOTES.md
